<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================= SEO & MAKLUMAT LAMAN WEB ================= -->
  <title>FIQZ GLOBAL - Official Samurai Theme</title>
  <meta name="description" content="Laman web rasmi FIQZ GLOBAL. Temui pelbagai produk digital, perkhidmatan web, dan rekaan eksklusif kami.">
  <meta name="keywords" content="FIQZ GLOBAL, produk digital, servis web, shopee, tiktok shop, malaysia">
  <meta name="author" content="FIQZ GLOBAL">

  <!-- ================= GAYA (CSS) ================= -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* Latar belakang animasi (Jangan usik) */
    #scroll-container { height: 500vh; }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1; /* Gambar duduk di lapisan bawah */
    }
    
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5; /* Gelapkan gambar sikit (50%) supaya teks putih lebih jelas */
    }

    /* Ruang Teks & Kandungan Laman Web */
    #content {
      position: relative;
      z-index: 10; /* Teks duduk di lapisan atas */
      pointer-events: none; /* Membolehkan scroll berfungsi walau tekan atas teks */
    }

    /* Seksyen untuk setiap skrol */
    .section {
      height: 100vh; /* Setiap bahagian ambil 100% tinggi skrin */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      pointer-events: auto; /* Aktifkan klik untuk butang dalam seksyen ini */
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
    }

    p {
      font-size: 1.5rem;
      max-width: 600px;
      line-height: 1.6;
      text-shadow: 1px 1px 10px rgba(0,0,0,0.9);
    }

    /* Gaya Butang CTA (Call to Action) */
    .button-group {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary { background-color: #ee4d2d; /* Warna oren Shopee */ }
    .btn-primary:hover { background-color: #d74325; transform: translateY(-3px); }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid white;
    }
    .btn-secondary:hover { background-color: white; color: black; transform: translateY(-3px); }
  </style>
</head>
<body>

  <!-- Animasi Canvas -->
  <div id="scroll-container">
    <div id="canvas-container">
      <canvas id="hero-lightpass"></canvas>
    </div>

    <!-- ================= KANDUNGAN HALAMAN (HOMEPAGE) ================= -->
    <div id="content">
      
      <!-- Skrin 1: Pengenalan -->
      <div class="section">
        <h1>FIQZ GLOBAL</h1>
        <p>Membawa Visi Digital ke Dunia Realiti.</p>
      </div>

      <!-- Skrin 2: Skrol Bawah Sikit -->
      <div class="section">
        <h1>Kualiti Premium</h1>
        <p>Kami menyediakan penyelesaian digital terbaik untuk perniagaan anda.</p>
      </div>

      <!-- Skrin 3: Pautan Kedai / CTA -->
      <div class="section">
        <h1>Terokai Koleksi Kami</h1>
        <p>Dapatkan perkhidmatan dan produk kami melalui platform rasmi.</p>
        <div class="button-group">
          <!-- Boleh tukar link shopee dan tiktok di bahagian href="..." -->
          <a href="https://shopee.com.my/" target="_blank" class="btn btn-primary">Shopee Store</a>
          <a href="https://tiktok.com/" target="_blank" class="btn btn-secondary">TikTok Shop</a>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= KOD JAVASCRIPT ANIMASI (KEKAL) ================= -->
  <script>
    const canvas = document.getElementById("hero-lightpass");
    const context = canvas.getContext("2d");

    const frameCount = 100;
    const currentFrame = index => (
      `SAMURAI GITHUB/ezgif-frame-${(index + 1).toString().padStart(3, '0')}.jpg`
    );

    const images = [];
    const airpods = { frame: 0 };

    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      images.push(img);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }

    function render() {
      const currentImg = images[airpods.frame];
      if (!currentImg || !currentImg.complete || currentImg.naturalWidth === 0) return;

      const hRatio = canvas.width / currentImg.width;
      const vRatio = canvas.height / currentImg.height;
      const ratio = Math.max(hRatio, vRatio);
      const centerShift_x = (canvas.width - currentImg.width * ratio) / 2;
      const centerShift_y = (canvas.height - currentImg.height * ratio) / 2;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(
        currentImg, 
        0, 0, currentImg.width, currentImg.height,
        centerShift_x, centerShift_y, currentImg.width * ratio, currentImg.height * ratio
      );
    }

    images[0].onload = () => {
      resizeCanvas();
    };

    window.addEventListener('resize', resizeCanvas);

    let targetScrollFraction = 0;
    let currentScrollFraction = 0;

    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop;
      const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
      targetScrollFraction = scrollTop / maxScrollTop;
    });

    function loop() {
      currentScrollFraction += (targetScrollFraction - currentScrollFraction) * 0.1;
      const frameIndex = Math.min(
        frameCount - 1,
        Math.max(0, Math.floor(currentScrollFraction * frameCount))
      );
      
      airpods.frame = frameIndex;
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
