<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll Animation</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #000;
    }
    #scroll-container {
      height: 500vh;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="scroll-container">
    <div id="canvas-container">
      <canvas id="hero-lightpass"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("hero-lightpass");
    const context = canvas.getContext("2d");

    const frameCount = 100;

    // Menjana nama fail mengikut format sebenar: SAMURAI GITHUB/ezgif-frame-001.jpg
    const currentFrame = index => (
      `SAMURAI GITHUB/ezgif-frame-${(index + 1).toString().padStart(3, '0')}.jpg`
    );

    const images = [];
    const airpods = { frame: 0 };

    // Preload semua 100 gambar
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      images.push(img);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }

    function render() {
      const currentImg = images[airpods.frame];
      if (!currentImg || !currentImg.complete || currentImg.naturalWidth === 0) return;

      const hRatio = canvas.width / currentImg.width;
      const vRatio = canvas.height / currentImg.height;
      const ratio = Math.max(hRatio, vRatio);
      const centerShift_x = (canvas.width - currentImg.width * ratio) / 2;
      const centerShift_y = (canvas.height - currentImg.height * ratio) / 2;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(
        currentImg, 
        0, 0, currentImg.width, currentImg.height,
        centerShift_x, centerShift_y, currentImg.width * ratio, currentImg.height * ratio
      );
    }

    images[0].onload = () => {
      resizeCanvas();
    };

    window.addEventListener('resize', resizeCanvas);

    let targetScrollFraction = 0;
    let currentScrollFraction = 0;

    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop;
      const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
      targetScrollFraction = scrollTop / maxScrollTop;
    });

    function loop() {
      currentScrollFraction += (targetScrollFraction - currentScrollFraction) * 0.1;
      const frameIndex = Math.min(
        frameCount - 1,
        Math.max(0, Math.floor(currentScrollFraction * frameCount))
      );
      
      airpods.frame = frameIndex;
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
