    .bg-image {

    nav ul {

      padding: 0;

      color: #ddd;
      text-decoration: none;
      font-size: 1rem;

      transition: color 0.3s;

    nav ul li a:hover { color: #ee4d2d; }

    .hero {

      border: 1px solid rgba(255, 255, 255, 0.1);

      padding: 50px;
      max-width: 800px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

    h1 {
      font-size: 3.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #ccc;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn {
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;

    .btn-shopee { background-color: #ee4d2d; }
